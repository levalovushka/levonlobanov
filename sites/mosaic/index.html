<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosaic Shader</title>
<style>
  /* One type size for everything you read or press (13px); 11px only for error text.
     Motion follows Emil Kowalski's and Jakub Krehel's guidance: ease-out for things that appear,
     the iOS drawer curve for things that move on screen, < 300ms, exits faster than enters,
     transitions (interruptible) instead of keyframes, named properties only, hover only on
     devices that hover, and a reduced-motion variant that keeps fades but drops movement. */
  :root {
    --bg: #000;
    --card: rgba(38, 38, 38, .6);
    --card-line: rgba(255, 255, 255, .07);
    --track: rgba(255, 255, 255, .07);
    --fill-a: rgba(255, 255, 255, .10);
    --fill-b: rgba(255, 255, 255, .22);
    --hover: rgba(255, 255, 255, .10);
    --text: #ece8e1;
    --muted: #9a958c;
    --fs: 13px;
    --fs-s: 11px;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);      /* strong ease-out */
    --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);   /* on-screen movement (iOS drawer) */
    --ease-swap: cubic-bezier(0.2, 0, 0, 1);         /* icon cross-fade */
  }
  /* squircle corners wherever there is a radius (falls back to plain rounding elsewhere) */
  *, *::before, *::after { box-sizing: border-box; corner-shape: superellipse(2); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: var(--fs)/1.3 ui-sans-serif, -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; }
  body { height: 100vh; overflow: hidden; }
  button { font: inherit; color: inherit; }

  /* the camera owns the whole window; the menu and the zoom bar float above it */
  #stage { position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none; }
  #stage.panning { cursor: grabbing; }
  #stage canvas { position: absolute; display: block; }
  #drop { position: absolute; inset: 12px; display: grid; place-items: center; border-radius: 20px;
    background: rgba(0, 0, 0, .8); border: 1px dashed var(--muted);
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 120ms ease-out, visibility 0s linear 120ms; }
  #stage.dragging #drop { opacity: 1; visibility: visible; transition: opacity 180ms var(--ease-out), visibility 0s; }

  aside { position: fixed; top: 12px; right: 12px; width: 316px; max-height: calc(100vh - 24px);
    overflow-y: auto; display: flex; flex-direction: column; gap: 10px; pointer-events: none;
    scrollbar-width: none; }
  aside::-webkit-scrollbar { display: none; }
  aside > * { pointer-events: auto; }
  #controls { display: flex; flex-direction: column; gap: 10px; }

  /* concentric radii: card = inner control (13) + padding (10) */
  .card { background: var(--card); border: 1px solid var(--card-line); border-radius: 23px; padding: 10px;
    -webkit-backdrop-filter: blur(32px) saturate(140%); backdrop-filter: blur(32px) saturate(140%); }
  /* Open / Download are menu items of their own, no card around them */
  #open, #save { height: 40px; border-radius: 16px; flex-shrink: 0; }
  #open { background: var(--card); border: 1px solid var(--card-line);
    -webkit-backdrop-filter: blur(32px) saturate(140%); backdrop-filter: blur(32px) saturate(140%); }
  /* Download: an ordinary last item while the menu fits; once the menu is taller than the
     window it sticks to the bottom edge (the aside's own 12px inset) and the cards scroll under it */
  #save { position: sticky; bottom: 0; z-index: 1; box-shadow: 0 0 0 1px rgba(0, 0, 0, .25); }

  /* collapsible section. The header keeps one height in both states; the spacing above the
     first control lives inside the collapsing part, so nothing jumps when it opens or closes. */
  .sec-head { width: 100%; height: 28px; display: flex; align-items: center; justify-content: space-between;
    background: none; border: 0; padding: 0 4px; cursor: pointer; color: var(--text); font-weight: 500; }
  .chev { display: grid; color: var(--muted); transition: rotate 260ms var(--ease-drawer), color 150ms ease; }
  .sec.closed .chev { rotate: -90deg; transition-duration: 200ms, 150ms; }
  .sec-wrap { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 260ms var(--ease-drawer); }
  .sec.closed .sec-wrap { grid-template-rows: 0fr; transition-duration: 200ms; }
  .sec-body { min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 6px;
    transition: opacity 220ms var(--ease-out), translate 260ms var(--ease-drawer); }
  .sec-body::before { content: ''; flex: none; height: 0; }      /* = one gap of space under the header */
  .sec.closed .sec-body { opacity: 0; translate: 0 -6px; transition-duration: 140ms, 200ms; }

  /* fill-bar slider: the fill follows the pointer with no lag; only reset (double-click) eases */
  .sl { position: relative; height: 32px; border-radius: 13px; background: var(--track); overflow: hidden;
    display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
    cursor: ew-resize; user-select: none; touch-action: none; outline: none; flex-shrink: 0; }
  .sl-fill { position: absolute; inset: 0 auto 0 0; pointer-events: none;
    background: linear-gradient(90deg, var(--fill-a), var(--fill-b));
    box-shadow: inset -1px 0 0 rgba(255, 255, 255, .3); transition: box-shadow 150ms ease; }
  .sl-fill::after { content: ''; position: absolute; inset: 0; background: rgba(255, 255, 255, .06);
    opacity: 0; transition: opacity 150ms ease; }
  .sl.easing .sl-fill { transition: box-shadow 150ms ease, width 240ms var(--ease-out); }
  .sl.active .sl-fill { box-shadow: inset -1px 0 0 rgba(255, 255, 255, .75); }
  .sl.active .sl-fill::after { opacity: 1; }
  .sl:focus-visible { box-shadow: 0 0 0 1px rgba(255, 255, 255, .35); }
  .sl-label, .sl-val { position: relative; pointer-events: none; white-space: nowrap; }
  .sl-val { color: var(--muted); font-variant-numeric: tabular-nums; transition: color 150ms ease; }
  .sl.active .sl-val { color: var(--text); }
  .sl-color { cursor: pointer; }
  .sl-color input { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; padding: 0;
    border: 1px solid rgba(255, 255, 255, .25); border-radius: 50%; background: none; cursor: pointer; }
  .sl-color input::-webkit-color-swatch-wrapper { padding: 0; }
  .sl-color input::-webkit-color-swatch { border: 0; border-radius: 50%; }
  .sl-color input::-moz-color-swatch { border: 0; border-radius: 50%; }

  .btn { height: 32px; padding: 0 12px; border: 0; border-radius: 13px; background: var(--hover); cursor: pointer;
    transition-property: scale, background-color, color, opacity; transition-duration: 160ms, 150ms, 150ms, 150ms;
    transition-timing-function: var(--ease-out), ease, ease, ease; }
  .btn:active:not(:disabled) { scale: 0.97; transition-duration: 100ms, 150ms, 150ms, 150ms; }
  .btn.primary { background: var(--text); color: #111; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.wide { width: 100%; }

  /* zoom bar: 40px tall (dense-desktop hit area); concentric: bar 16 = button 12 + padding 4 */
  #zoombar { position: fixed; left: 12px; bottom: 12px; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 16px; }
  #zoombar .btn { height: 32px; min-width: 32px; padding: 0 8px; background: none; border-radius: 12px; }
  #zoombar .btn.on { background: rgba(255, 255, 255, .16); }
  #zoombar .pct { min-width: 56px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .zsep { width: 1px; height: 18px; margin: 0 4px; background: rgba(255, 255, 255, .12); }
  /* view toggle: both icons stay in the DOM and cross-fade (scale .25 → 1, blur 4px → 0) */
  .vt { position: relative; width: 32px; padding: 0 !important; color: var(--muted); }
  .vt .ico { position: absolute; inset: 0; display: grid; place-items: center;
    transition-property: opacity, scale, filter; transition-duration: 220ms; transition-timing-function: var(--ease-swap); }
  .vt .ico.off { opacity: 0; scale: 0.25; filter: blur(4px); }
  .vt.on { color: var(--text); }

  @media (hover: hover) and (pointer: fine) {
    .btn:hover { background: rgba(255, 255, 255, .16); }
    .btn.primary:hover { background: #fff; }
    #open:hover { background: rgba(58, 58, 58, .7); }
    #zoombar .btn:hover { background: var(--hover); }
    #zoombar .btn.on:hover { background: rgba(255, 255, 255, .2); }
    .vt:hover { color: var(--text); }
    .sec-head:hover .chev { color: var(--text); }
    .sl:hover .sl-fill { box-shadow: inset -1px 0 0 rgba(255, 255, 255, .6); }
    .sl:hover .sl-fill::after { opacity: 1; }
    .sl:hover .sl-val { color: var(--text); }
  }

  /* reduced motion: fewer, gentler — keep fades and colour, drop movement */
  @media (prefers-reduced-motion: reduce) {
    .btn:active:not(:disabled) { scale: 1; }
    .sec-wrap, .chev { transition-duration: 0ms !important; }
    .sec.closed .sec-body { translate: none; }
    .vt .ico.off { scale: 1; filter: none; }
    .sl.easing .sl-fill { transition: none; }
  }

  #err { color: #ff8a7a; white-space: pre-wrap; font-size: var(--fs-s); }
  #err:empty { display: none; }
</style>
</head>
<body>
  <main id="stage">
    <canvas id="view"></canvas>
    <div id="drop">Drop an image</div>
  </main>
  <div id="zoombar" class="card"></div>
  <aside>
    <div id="controls"></div>
    <div id="err"></div>
    <input id="file" type="file" accept="image/*" hidden>
  </aside>
  <script type="module" src="mosaic.js"></script>
</body>
</html>
